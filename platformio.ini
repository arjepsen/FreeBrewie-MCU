; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = mega2560_bare

; Normal FreeBrewie workflow:
;   1. Build this environment.
;   2. Copy .pio/build/mega2560_bare/firmware.hex to the SOM.
;   3. Flash from the SOM with FreeBrewie-SOM/Deploy/Admin/flash_mcu_from_som.sh.
;
; USBasp/ISP should be treated as recovery/bootstrap only. It can install the
; Brewie-compatible ATmega2560 bootloader, but normal firmware updates should go
; through the SOM so the bootloader remains part of the deployment path.
[env:mega2560_bare]
platform = atmelavr
board = brewie_atmega2560
framework =
build_flags =
  -std=gnu11
  -Wall
  -Wextra
  -Werror
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

build_unflags = -flto

; Do not use this environment's PlatformIO Upload button for the normal workflow.
; The target serial bootloader is reached from the SOM over /dev/ttyS1.
upload_protocol = wiring
upload_speed = 115200

monitor_speed = 115200

[env:mega2560_recovery_usbasp]
extends = env:mega2560_bare
framework = arduino
board_build.core = arduino
extra_scripts = Tools/PlatformIO/Usbasp_bootloader.py

; Recovery/bootstrap path only:
; - use this with a USBasp/ISP programmer to install the Brewie-compatible
;   ATmega2560 bootloader
; - use the "Restore Bootloader USBasp" custom target rather than the built-in
;   "Burn Bootloader" target, because the custom target keeps the whole recovery
;   sequence inside one avrdude session and leaves the app-startup lock/fuse
;   state proven on hardware
; - avoid using it as the normal firmware upload path, because ISP flashing can remove or
;   bypass the bootloader that SOM-side updates require
upload_protocol = usbasp
upload_flags =
  -B
  100
